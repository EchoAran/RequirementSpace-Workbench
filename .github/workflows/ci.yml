name: CI

on:
  push:
    branches: [ main, 'release/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_requirement_space
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx ruff

      - name: Run Backend Lint (Ruff)
        run: |
          ruff check backend --select=E9,F63,F7,F82

      - name: Run Backend SQLite Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-pipeline-min-32-chars
          LLM_CONFIG_ENCRYPTION_KEY: rK9PjN_wO2v5gVjHqX8zL1_pT5yW3xM8mU7bC4tN2zI=
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
        run: |
          pytest backend/tests -v --tb=short

      - name: Run PostgreSQL Schema Integration Test
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-pipeline-min-32-chars
          LLM_CONFIG_ENCRYPTION_KEY: rK9PjN_wO2v5gVjHqX8zL1_pT5yW3xM8mU7bC4tN2zI=
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:password@localhost:5432/test_requirement_space
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
        run: |
          # 运行真实 PostgreSQL Schema 自举与约束校验
          pytest backend/tests/database/test_schema_bootstrap.py -k "test_postgresql_schema_bootstrap_actual" -v --tb=short

  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript & Lint Check
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm run test

      - name: Build Frontend Production Artifact
        working-directory: frontend
        run: npm run build
